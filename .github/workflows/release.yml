# Builds a signed APK and publishes it as a GitHub Release. Started by hand only, from main:
#   gh workflow run release.yml   (or Actions → Release → Run workflow)
# The version is package.json's; its notes are its section in CHANGELOG.md.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the version and notes
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::release from main only"; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3"; exit 1; }
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null | sed 's/^v//' || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)" != "$VERSION" -o "$latest" = "$VERSION" ]; then
            echo "::error::$VERSION is not newer than the latest release $latest; bump package.json"; exit 1
          fi
          awk -v v="$VERSION" '/^## /{p=($2==v); next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }

      - uses: jdx/mise-action@v3
      - run: mise run android-setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm android

      - name: Build the signed APK
        env:
          LIFELOG_KEYSTORE: ${{ runner.temp }}/lifelog-release.jks
          LIFELOG_KEYSTORE_PASSWORD: ${{ secrets.LIFELOG_KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.LIFELOG_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$LIFELOG_KEYSTORE"
          cd android  # mise x: its JAVA_HOME/ANDROID_HOME, not the runner's preinstalled JDK
          mise x -- ./gradlew --no-daemon :app:testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/lifelog-$VERSION.apk"
          mise x -- apksigner verify --print-certs "$RUNNER_TEMP/lifelog-$VERSION.apk" | grep SHA-256

      - name: Publish the release
        run: gh release create "v$VERSION" "$RUNNER_TEMP/lifelog-$VERSION.apk" --target "$GITHUB_SHA" --title "LifeLog $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
